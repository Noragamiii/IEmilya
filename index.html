<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Danh mục">
<meta name="robots" content="noindex">
<title>Danh mục</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="app-192.png">
<link rel="apple-touch-icon" href="app-192.png">
<!--
  BẢN ĐIỆN THOẠI của app Quản lý danh mục (14/11/2026) – MỘT file, không thư viện, không biểu đồ nặng.
  Đặt thư mục này lên GitHub Pages. Trang KHÔNG chứa số liệu: số liệu nằm trong một Gist bí mật, đã mã hóa bằng mật khẩu đồng bộ
  (máy tính đẩy lên – xem pm/sync.py). Trang này: tải Gist → giải mã bằng Web Crypto → hiển thị; trong phiên tự lấy giá trực tiếp từ nguồn công khai.
  Nhẹ máy: ~45 KB + ảnh 16 KB; mở lần sau lấy từ bộ nhớ đệm (sw.js) nên hiện ngay; chỉ hỏi giá khi màn hình đang bật VÀ đang trong phiên;
  mỗi lần có giá mới chỉ sửa đúng những dòng thay đổi.
-->
<style>
:root{--page:#F6F1E7;--sf:#FFFDF8;--sf2:#F3ECDF;--sf3:#E8DFCF;--tx:#2B2520;--tx2:#51483F;--tx3:#6B6156;--bd:rgba(84,62,30,.14);--bd2:rgba(84,62,30,.28);
  --pri:#3B5FD9;--pri-ink:#2F51C4;--pri-soft:rgba(59,95,217,.1);--risk:#B93226;--risk-soft:rgba(201,60,44,.1);--brand:#F6B24B;--brand-soft:#FBE7C2;--brand-line:#E9A234;
  --up:#0E8A4F;--dn:#CF2F2A;--ref:#A66A00;--ceil:#A23BD6;--floor:#0B86A8;--fu:rgba(14,138,79,.18);--fd:rgba(207,47,42,.16);--pink:#FAD3E0;
  --font:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme=dark]{--page:#1F1B17;--sf:#2A2520;--sf2:#342E28;--sf3:#40382F;--tx:#F3EDE3;--tx2:#CFC6B8;--tx3:#A99F90;--bd:rgba(255,240,215,.12);--bd2:rgba(255,240,215,.24);
  --pri:#6F8DF0;--pri-ink:#9DB2F6;--pri-soft:rgba(111,141,240,.16);--risk:#FF8378;--risk-soft:rgba(255,131,120,.14);--brand-soft:#4A3A1C;--brand-line:#C98A24;
  --up:#3DD68C;--dn:#FF6B62;--ref:#F5C542;--ceil:#D98BFF;--floor:#4FD2F2;--fu:rgba(61,214,140,.24);--fd:rgba(255,107,98,.24);--pink:#5A3A46}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--tx);font:500 15px/1.5 var(--font);padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));min-height:100vh;overscroll-behavior-y:contain}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.u{color:var(--up)}.d{color:var(--dn)}.r{color:var(--ref)}.ce{color:var(--ceil)}.fl{color:var(--floor)}
.num{font-variant-numeric:tabular-nums}
/* đầu trang: Emilya + lời chào */
.hd{display:flex;gap:12px;align-items:center;padding:14px 0 10px}
.emi{position:relative;flex:none;width:62px;height:62px;border:0;padding:0;background:none}
.emi span{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 35%,#FFF4F8,var(--pink) 80%);box-shadow:inset 0 0 0 2px rgba(236,120,160,.5);transform-origin:50% 90%;animation:fl 3.6s ease-in-out infinite}
.emi img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;transform:scale(1.12);transform-origin:50% 30%;display:block}
.emi i{position:absolute;right:-6px;top:-8px;font:800 20px/1 var(--font);font-style:normal}
.emi.happy span,.emi.joy span{box-shadow:inset 0 0 0 2.5px rgba(240,170,40,.85);animation:bob 1.4s ease-in-out infinite}
.emi.joy span{animation:jump .9s cubic-bezier(.3,.6,.4,1) infinite}
.emi.worry span{box-shadow:inset 0 0 0 2.5px rgba(110,170,215,.8);animation:shake 1.1s linear infinite}
.emi.sad span{filter:saturate(.7);box-shadow:inset 0 0 0 2.5px rgba(120,134,152,.8);animation:droop 4s ease-in-out infinite}
.emi.sleepy span{filter:saturate(.85);box-shadow:inset 0 0 0 2.5px rgba(140,107,224,.6);animation:breath 4.5s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5%) rotate(2deg)}}
@keyframes jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-11%) scale(.97,1.04)}80%{transform:scale(1.03,.97)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2%)}75%{transform:translateX(2%)}}
@keyframes droop{0%,100%{transform:translateY(3%) rotate(-3deg)}50%{transform:translateY(5%) rotate(-4.5deg)}}
@keyframes breath{0%,100%{transform:scale(1) rotate(3deg)}50%{transform:scale(1.03,.98) rotate(4deg)}}
.say{flex:1;min-width:0;background:var(--sf);border:1px solid var(--bd);border-radius:6px 18px 18px 18px;padding:9px 13px;font-size:14px;font-weight:600;color:var(--tx2)}
.say b{color:var(--tx);font-weight:800}.say b.u{color:var(--up)}.say b.d{color:var(--dn)}
/* thẻ */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--tx3)}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.big small{font-size:15px;font-weight:700;color:var(--tx3);margin-left:4px}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.kp div{background:var(--sf2);border-radius:12px;padding:8px 10px;min-width:0}
.kp small{display:block;font-size:11.5px;font-weight:800;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp b{display:block;font-size:16px;font-weight:800}
.kp span{display:block;font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* thanh trạng thái + chỉ số */
.bar{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;gap:6px;align-items:baseline;min-height:30px;padding:5px 11px;border-radius:999px;background:var(--sf);border:1px solid var(--bd);font-size:13px;font-weight:700;white-space:nowrap}
.pill small{font-weight:650;color:var(--tx3);font-size:12px}
.pill.live{background:var(--fu);border-color:transparent;color:var(--up)}
.pill.live::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--up);align-self:center;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.seg{display:flex;background:var(--sf2);border-radius:13px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;min-height:38px;border-radius:10px;font-weight:700;font-size:14px;color:var(--tx2)}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 3px rgba(84,62,30,.18)}
.add{display:flex;gap:8px;margin-bottom:10px}
.add input{flex:1;min-width:0;height:44px;border-radius:13px;border:1px solid var(--bd2);background:var(--sf);padding:0 14px;font-weight:700;font-size:16px;text-transform:uppercase}
.add input::placeholder{text-transform:none;font-weight:600;color:var(--tx3)}
.add button,.btn{height:44px;border-radius:13px;border:0;background:var(--pri);color:#fff;padding:0 16px;font-weight:800;font-size:15px}
.btn.ghost{background:var(--sf);color:var(--tx);border:1px solid var(--bd2)}
.btn.risk{background:var(--sf);color:var(--risk);border:1px solid var(--bd2)}
/* danh sách mã */
.list{background:var(--sf);border:1px solid var(--bd);border-radius:18px;overflow:hidden}
.row{border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.rh{display:grid;grid-template-columns:minmax(0,1fr) 66px auto;gap:10px;align-items:center;width:100%;min-height:58px;padding:8px 12px 8px 14px;border:0;background:none;text-align:left}
.tk{font-size:16px;font-weight:800;display:flex;align-items:center;gap:6px}
.tk i{width:7px;height:7px;border-radius:50%;background:var(--brand-line);flex:none}
.tk em{font-style:normal;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--pri-soft);color:var(--pri-ink)}
.tk em.hit{background:var(--pri);color:#fff}
.nm{font-size:12px;font-weight:600;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{text-align:right}
.pr b{display:block;font-size:17px;font-weight:800;border-radius:6px;padding:0 3px}
.pr span{display:inline-block;font-size:12.5px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--sf2)}
.fu{animation:fu .7s ease-out}.fd{animation:fd .7s ease-out}
@keyframes fu{0%{background:var(--fu)}100%{background:transparent}}
@keyframes fd{0%{background:var(--fd)}100%{background:transparent}}
.dt{padding:2px 14px 14px;display:none}
.row.open .dt{display:block}
.row.open .rh{background:var(--sf2)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.g3 div{background:var(--sf2);border-radius:10px;padding:6px 9px}
.g3 small{display:block;font-size:11px;font-weight:800;color:var(--tx3)}
.g3 b{font-size:14.5px;font-weight:800}
.dt label{display:block;font-size:12px;font-weight:800;color:var(--tx3);margin:12px 0 4px}
.dt input,.dt textarea,.set input{width:100%;border:1px solid var(--bd2);border-radius:11px;background:var(--sf);padding:10px 12px;font-size:16px;font-weight:600}
.dt textarea{min-height:60px;resize:vertical}
.dt .ac{display:flex;gap:8px;margin-top:12px}
.dt .ac .btn{flex:1;height:42px;font-size:14px;padding:0 8px}
.wbar{height:5px;border-radius:3px;background:var(--sf3);margin-top:4px;overflow:hidden}
.wbar i{display:block;height:100%;background:var(--brand-line);border-radius:3px}
.note{padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px;color:var(--tx2)}
.note:last-child{border-bottom:0;padding-bottom:0}
.note b{display:block;color:var(--tx)}
.note.bad b::before{content:'! ';color:var(--risk)}
.rule{padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px;color:var(--tx2)}
.rule:last-child{border-bottom:0}
.rule b{color:var(--tx)}
.rule span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--tx);font-size:12px;font-weight:800;margin-right:6px}
.muted{color:var(--tx3);font-size:12.5px}
.empty{padding:28px 16px;text-align:center;color:var(--tx2)}
.msg{margin:0 0 10px;padding:10px 13px;border-radius:13px;background:var(--pri-soft);color:var(--pri-ink);font-size:13.5px;font-weight:650}
.msg.bad{background:var(--risk-soft);color:var(--risk)}
.set label{display:block;font-size:13px;font-weight:800;color:var(--tx2);margin:12px 0 4px}
.set .btn{width:100%;margin-top:14px}
/* menu dưới */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--tx3)}
.tabs button svg{width:23px;height:23px}
.tabs button.on{color:var(--tx)}
.tabs button.on svg{color:var(--brand-line)}
[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><button class="emi" id="emi" aria-label="Emilya"><span><img src="emilya.webp" alt="" width="62" height="62"></span><i id="emiFx"></i></button><div class="say" id="say">Đang mở sổ…</div></div>
  <div id="msg"></div>

  <section id="p-board">
    <div class="bar" id="bar"></div>
    <div class="seg" id="seg"><button data-v="watch">Theo dõi</button><button data-v="held">Đang giữ</button><button data-v="all">Tất cả</button></div>
    <form class="add" id="add" hidden><input type="text" maxlength="8" placeholder="Thêm mã theo dõi…" aria-label="Thêm mã theo dõi" autocomplete="off" autocapitalize="characters"><button type="submit">Thêm</button></form>
    <div class="list" id="list"></div>
    <p class="muted" id="src" style="margin:10px 4px"></p>
  </section>

  <section id="p-pf" hidden></section>
  <section id="p-news" hidden></section>
  <section id="p-me" hidden></section>
  <section id="p-setup" hidden></section>
</div>
<nav class="tabs" id="tabs" aria-label="Chuyển mục">
  <button data-p="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5h16"/><rect x="5.5" y="11" width="3.2" height="6" rx="1"/><rect x="10.4" y="7" width="3.2" height="10" rx="1"/><rect x="15.3" y="13" width="3.2" height="4" rx="1"/></svg>Bảng giá</button>
  <button data-p="pf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7.5" width="17" height="12" rx="2.5"/><path d="M9 7.5V6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 6v1.5M3.5 12.5h17"/></svg>Danh mục</button>
  <button data-p="news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4.5" width="16" height="15" rx="2.5"/><path d="M8 9h8M8 12.5h8M8 16h5"/></svg>Tin</button>
  <button data-p="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-9.6A4 4 0 0 1 12 8a4 4 0 0 1 7 2.4C19 15.6 12 20 12 20z"/></svg>Emilya</button>
</nav>

<script>
(() => {
  'use strict';
  /* ------------------------------------------------------------------ tiện ích */
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const isN = v => typeof v === 'number' && isFinite(v);
  const NF = d => new Intl.NumberFormat('vi-VN', { minimumFractionDigits: d, maximumFractionDigits: d });
  const n0 = NF(0), n1 = NF(1), n2 = NF(2);
  const px = v => (isN(v) ? n2.format(v / 1000) : '–');
  const vol = v => (!isN(v) ? '–' : v >= 1e6 ? n2.format(v / 1e6) + 'M' : v >= 1e4 ? n1.format(v / 1e3) + 'K' : n0.format(v));
  const fm = (v, d = 1) => (isN(v) ? (v >= 0.00005 ? '+' : v <= -0.00005 ? '−' : '') + NF(d).format(Math.abs(v * 100)) + '%' : '–');
  const money = v => { if (!isN(v)) return '–'; const a = Math.abs(v), s = v > 0 ? '+' : v < 0 ? '−' : ''; return s + (a >= 1e9 ? NF(2).format(a / 1e9) + ' tỷ' : a >= 1e6 ? n1.format(a / 1e6) + ' tr' : n0.format(a / 1e3) + ' nghìn'); };
  const ud = v => (v > 0 ? 'u' : v < 0 ? 'd' : '');
  const hm = ts => (ts ? new Date(ts * 1000).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) : '');
  const dmhm = ts => { if (!ts) return 'chưa có'; const d = new Date(ts * 1000), t = new Date(); return (d.toDateString() === t.toDateString() ? '' : d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' }) + ' ') + hm(ts); };
  const LS = { get(k, d) { try { const v = localStorage.getItem('qm-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('qm-' + k, JSON.stringify(v)); } catch (e) { /* bỏ qua */ } }, del(k) { try { localStorage.removeItem('qm-' + k); } catch (e) { /* bỏ qua */ } } };
  const APPV = 'bản 15/11 v6';
  const LOCAL = location.hostname === '127.0.0.1' || location.hostname === 'localhost';   // xem thử trên máy tính: đọc thẳng app, không cần Gist
  const th = LS.get('theme', '') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = th;

  /* ------------------------------------------------------------------ mã hóa – cùng công thức với pm/sync.py */
  const te = new TextEncoder(), td = new TextDecoder();
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64e = u => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  const cat = (...a) => { const o = new Uint8Array(a.reduce((n, x) => n + x.length, 0)); let p = 0; for (const x of a) { o.set(x, p); p += x.length; } return o; };
  async function keys(pw, salt) {
    const km = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const k = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 150000 }, km, 512));
    const imp = x => crypto.subtle.importKey('raw', x, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    return [await imp(k.slice(0, 32)), await imp(k.slice(32))];
  }
  async function xor(kenc, nonce, data) {
    const nb = Math.ceil(data.length / 32), jobs = [];
    for (let i = 0; i < nb; i++) { const c = new Uint8Array(20); c.set(nonce); new DataView(c.buffer).setUint32(16, i); jobs.push(crypto.subtle.sign('HMAC', kenc, c)); }
    const ks = await Promise.all(jobs), out = new Uint8Array(data.length);
    for (let i = 0; i < nb; i++) { const k = new Uint8Array(ks[i]), o = i * 32; for (let j = 0; j < 32 && o + j < data.length; j++) out[o + j] = data[o + j] ^ k[j]; }
    return out;
  }
  const MAGIC = te.encode('QLDM1');
  async function decrypt(text, pw) {
    const o = JSON.parse(text), salt = b64d(o.salt), nonce = b64d(o.nonce), tag = b64d(o.tag), ct = b64d(o.ct);
    const [kenc, kmac] = await keys(pw, salt);
    const t2 = new Uint8Array(await crypto.subtle.sign('HMAC', kmac, cat(MAGIC, salt, nonce, ct)));
    let diff = tag.length ^ t2.length; for (let i = 0; i < t2.length; i++) diff |= tag[i] ^ t2[i];
    if (diff) throw new Error('Sai mật khẩu đồng bộ');
    return JSON.parse(td.decode(await xor(kenc, nonce, ct)));
  }
  async function encrypt(obj, pw) {
    const pt = te.encode(JSON.stringify(obj)), salt = crypto.getRandomValues(new Uint8Array(16)), nonce = crypto.getRandomValues(new Uint8Array(16));
    const [kenc, kmac] = await keys(pw, salt), ct = await xor(kenc, nonce, pt);
    const tag = new Uint8Array(await crypto.subtle.sign('HMAC', kmac, cat(MAGIC, salt, nonce, ct)));
    return JSON.stringify({ v: 1, alg: 'PBKDF2-SHA256-150000/HMAC-CTR/HMAC-SHA256', salt: b64e(salt), nonce: b64e(nonce), tag: b64e(tag), ct: b64e(ct) });
  }
  /* gộp danh sách theo dõi – cùng quy tắc với pm/sync.py merge_watch: từng mã, lần sửa sau cùng thắng */
  function mergeWatch(a, b) {
    a = a || {}; b = b || {};
    const A = a.tickers || [], B = b.tickers || [], mt = (w, t) => (w.mt || {})[t] || 0, gone = (w, t) => (w.gone || {})[t] || 0;
    const out = { tickers: [], notes: {}, targets: {}, mt: {}, gone: {} };
    for (const t of A.concat(B.filter(x => !A.includes(x)))) {
      const ia = A.includes(t), ib = B.includes(t), added = Math.max(ia ? mt(a, t) : 0, ib ? mt(b, t) : 0), removed = Math.max(gone(a, t), gone(b, t));
      if ((ia && ib) || added >= removed) {
        const src = ia && (!ib || mt(a, t) >= mt(b, t)) ? a : b;
        out.tickers.push(t);
        if ((src.notes || {})[t]) out.notes[t] = src.notes[t];
        if ((src.targets || {})[t]) out.targets[t] = src.targets[t];
        if (added) out.mt[t] = added;
      } else out.gone[t] = removed;
    }

        <div class="kp num"><div><small>${T.live ? 'Hôm nay' : 'Phiên ' + String(m.last || '').slice(8, 10) + '/' + String(m.last || '').slice(5, 7)}</small><b class="${ud(T.day_pct)}">${fm(T.day_pct, 2)}</b><span>${money(T.day_chg)}</span></div>
          <div><small>Từ đầu năm</small><b class="${ud(m.ytd_p)}">${fm(m.ytd_p)}</b><span>${esc(m.bench === 'VNINDEX' ? 'VN-Index' : m.bench || 'chỉ số')} ${fm(m.ytd_b)}</span></div>
          <div><small>So với chỉ số</small><b class="${ud(df)}">${isN(df) ? (df >= 0 ? '+' : '−') + n1.format(Math.abs(df * 100)) + ' đ%' : '–'}</b><span>${df >= 0 ? 'đang hơn' : 'đang kém'}</span></div></div>
        ${isN(m.margin) && m.margin > 0 ? `<p class="muted" style="margin:10px 0 0">Nợ margin ${money(m.margin).replace('+', '')} · đòn bẩy ${isN(m.lev) ? NF(2).format(m.lev) : '–'} lần</p>` : ''}</div>
      ${(s.notes || []).length ? `<div class="card"><h2>Kỷ luật danh mục – cần để ý</h2>${s.notes.map(n => `<div class="note ${n.lv}"><b>${esc(n.title)}</b>${esc(n.text)}</div>`).join('')}</div>` : ''}
      <h2 class="muted" style="margin:14px 4px 8px;font-weight:800;text-transform:uppercase;letter-spacing:.3px">Đang nắm giữ · ${hold.length} mã</h2>
      <div class="list">${hold.map(h => `<div class="row"><div class="rh" style="grid-template-columns:minmax(0,1fr) auto"><div><div class="tk">${esc(h.t)} <span class="muted" style="font-weight:700">${n1.format(h.p * h.qty / tot * 100)}%</span></div><div class="nm">${n0.format(h.qty)} cp · vốn ${px(h.avg)} · giá ${px(h.p)}</div><div class="wbar"><i style="width:${Math.min(100, h.p * h.qty / tot * 100 * 2.5).toFixed(0)}%"></i></div></div>
        <div class="pr num"><b class="${ud(h.pl)}">${fm(h.pl)}</b><span class="${ud(h.day)}">hôm nay ${fm(h.day)}</span></div></div></div>`).join('')}</div>
      ${(s.events || []).length ? `<div class="card" style="margin-top:12px"><h2>Sự kiện sắp tới</h2>${s.events.map(e => `<div class="note"><b>${esc(e.t)} · ${esc(String(e.ex || '').slice(8, 10) + '/' + String(e.ex || '').slice(5, 7))}${e.h === false ? ' <span class="muted" style="font-weight:700">· đang theo dõi</span>' : ''}</b>${esc(e.title || '')}</div>`).join('')}</div>` : ''}
      <p class="muted" style="margin:10px 4px">Số liệu máy tính tính lúc ${dmhm(s.ts)}${T.live ? '; lãi lỗ hôm nay tính lại theo giá điện thoại vừa lấy' : ''}. Nhập lệnh mua / bán trên máy tính.</p>`;
  }
  const RULES = [['Hiểu doanh nghiệp', 'Giải thích được trong 3 câu: bán gì, cho ai, lãi từ đâu? Chưa giải thích được thì chưa mua.'], ['Lợi thế đo được', 'Lợi thế phải hiện ra trên sản lượng, biên lợi nhuận, ROE và tiền – không chỉ là câu chuyện.'],
    ['Tăng trưởng giải thích được', 'Bán nhiều hơn, tài sản mới thì giữ lâu được. Tăng nhờ giá hàng hóa là chu kỳ – kỷ luật mua bán riêng.'], ['Người lái và tiền thật', 'Lợi nhuận phải về thành tiền, tiền phải về tới cổ đông nhỏ.'],
    ['Giá hợp lý, có biên an toàn', 'Doanh nghiệp tốt mua giá quá cao vẫn là khoản đầu tư kém. Không mua đuổi; đặt sẵn giá chờ.'], ['Tỷ trọng theo độ hiểu', 'Một mã không quá 20–25% tài sản; số mã vừa đủ để theo sát; cẩn trọng với margin.'],
    ['BCTC là kỳ kiểm tra', 'Viết sẵn điều gì khiến mình bán. Bán vì luận điểm sai hoặc giá quá đắt – không bán chỉ vì giá giảm.']];
  function renderMe() {
    const s = SNAP;
    $('#p-me').innerHTML = `<div class="card"><h2>7 nguyên tắc của mình</h2>${RULES.map((r, i) => `<div class="rule"><span>${i + 1}</span><b>${r[0]}.</b> ${r[1]}</div>`).join('')}</div>
      <div class="card"><h2>Đồng bộ</h2>
        <div class="note"><b>Phiên bản trang</b>${APPV} · có ô “Xem nhanh giá” và “Bật quyền sửa”</div><div class="note"><b>Máy tính đẩy lên lần cuối</b>${s ? dmhm(s.ts) : 'chưa có'}</div>
        <div class="note"><b>Giá trong phiên</b>${LIVE_OK ? 'Điện thoại tự lấy từ ' + esc(QSRC) : LIVE_OK === false ? 'Chưa tự lấy được – đang dùng giá máy tính đẩy lên' : 'Đang kiểm tra…'}</div>
        <div class="note"><b>Sửa danh sách theo dõi trên điện thoại</b>${canWrite() ? (DIRTY ? 'Có thay đổi đang chờ đẩy lên' : 'Được phép · mọi thay đổi đã lưu') : 'Chỉ xem (đường dẫn cài đặt không kèm quyền ghi)'}</div>
        <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="bSync" style="flex:1">⟳ Tải lại</button><button class="btn ghost" id="bTheme" style="flex:1">${document.documentElement.dataset.theme === 'dark' ? 'Nền sáng' : 'Nền tối'}</button></div>
        ${LOCAL && !CFG ? '<p class="muted" style="margin:10px 0 0">Đây là bản xem thử trên máy tính (đọc thẳng từ app). Trên điện thoại trang sẽ đọc từ Gist.</p>' : '<button class="btn risk" id="bOut" style="width:100%;margin-top:8px">Xóa dữ liệu khỏi điện thoại này</button>'}</div>
      ${CFG && !canWrite() ? `<div class="card set"><h2>Bật thêm / sửa mã theo dõi</h2><p style="margin:0;color:var(--tx2)">Dán mã truy cập GitHub (quyền Gist) – mã chỉ lưu trong điện thoại này, không gửi đi đâu ngoài github.com.</p><label for="tkIn">Mã truy cập GitHub</label><input id="tkIn" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" id="bTok">Bật quyền sửa</button></div>` : ''}
      <p class="muted" style="margin:0 4px">Emilya chỉ hiển thị số liệu app đã tính – không phải lời khuyên mua bán.</p>`;
  }

  let NV = LS.get('nview', 'all');
  const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
  const ago = ts => { const m = Math.max(0, (now() - ts) / 60); return m < 60 ? Math.max(1, Math.round(m)) + ' phút' : m < 1440 ? Math.round(m / 60) + ' giờ' : Math.round(m / 1440) + ' ngày'; };
  function newsRow(n) {
    const lk = safeUrl(n.lk), tone = n.tone === 'good' ? 'u' : n.tone === 'bad' ? 'd' : '';
    const inner = `<div class="tk">${(n.t || []).map(t => `<span class="${tone}">${esc(t)}</span>`).join(' · ')}${(n.t || []).length ? ' ' : ''}<span class="muted" style="font-weight:700">${esc(n.cat || '')}</span></div>
      <div style="font-size:15px;line-height:1.35;margin:3px 0">${esc(n.ti)}</div><div class="muted" style="font-size:12.5px">${esc(n.src || '')}${n.src ? ' · ' : ''}${ago(n.ts)} trước${lk ? ' · mở bài gốc ›' : ''}</div>`;
    return lk ? `<a class="row" style="display:block;padding:12px 14px;color:inherit;text-decoration:none" href="${esc(lk)}" target="_blank" rel="noopener noreferrer">${inner}</a>` : `<div class="row" style="padding:12px 14px">${inner}</div>`;
  }
  function renderNews() {
    const s = SNAP;
    if (!s) { $('#p-news').innerHTML = '<div class="card empty">Chưa có dữ liệu.</div>'; return; }
    const held = new Set((s.hold || []).map(h => h.t)), W = new Set((watch().tickers || []));
    let L = (s.news || []).slice();
    if (NV === 'held') L = L.filter(n => (n.t || []).some(t => held.has(t)));
    else if (NV === 'watch') L = L.filter(n => (n.t || []).some(t => W.has(t) && !held.has(t)));
    L.sort((a, b) => b.ts - a.ts);
    const al = s.alerts || [], ev = (s.events || []);
    $('#p-news').innerHTML = (al.length ? `<div class="card"><h2>Cần để ý – mã đang giữ</h2>${al.map(n => `<div class="note bad"><b>${esc((n.t || []).join(', '))} · ${esc(n.cat || '')}</b>${safeUrl(n.lk) ? `<a href="${esc(safeUrl(n.lk))}" target="_blank" rel="noopener noreferrer" style="color:inherit">${esc(n.ti)}</a>` : esc(n.ti)}</div>`).join('')}</div>` : '')
      + (ev.length ? `<div class="card"><h2>Sắp tới (cổ tức, quyền)</h2>${ev.slice(0, 6).map(e => `<div class="note"><b>${esc(e.t)} · ${esc(String(e.ex || '').slice(8, 10) + '/' + String(e.ex || '').slice(5, 7))}${e.h === false ? ' <span class="muted" style="font-weight:700">· đang theo dõi</span>' : ''}</b>${esc(e.title || '')}</div>`).join('')}</div>` : '')
      + `<div class="seg"><button data-nv="all" class="${NV === 'all' ? 'on' : ''}">Tất cả</button><button data-nv="held" class="${NV === 'held' ? 'on' : ''}">Đang giữ</button><button data-nv="watch" class="${NV === 'watch' ? 'on' : ''}">Theo dõi</button></div>`
      + (L.length ? `<div class="list">${L.map(newsRow).join('')}</div>` : `<div class="card empty">${(s.news || []).length ? 'Không có tin cho nhóm này.' : 'Chưa có tin. Máy tính cần mở mục Tin một lần (để tải tin) rồi đồng bộ lại.'}</div>`)
      + ((s.mac || []).length && NV === 'all' ? `<h2 class="muted" style="margin:14px 4px 8px;font-weight:800;text-transform:uppercase;letter-spacing:.3px">Vĩ mô</h2><div class="list">${s.mac.map(newsRow).join('')}</div>` : '')
      + `<p class="muted" style="margin:10px 4px">Chỉ tiêu đề và đường dẫn, tối đa 3 tin nóng nhất mỗi mã; máy tính chọn lúc ${dmhm(s.ts)}. Tin tự động, có thể sai mã – xem bài gốc trước khi quyết định.</p>`;
  }
  $('#p-news').addEventListener('click', e => { const b = e.target.closest('[data-nv]'); if (!b) return; NV = b.dataset.nv; LS.set('nview', NV); renderNews(); });
  function renderSetup(err) {
    $('#p-setup').innerHTML = `<div class="card set"><h2>Cài đặt lần đầu</h2>
      <p style="margin:0 0 4px;color:var(--tx2)">Trên máy tính: <b>Danh mục → Cài đặt → Điện thoại &amp; đồng bộ → Lấy đường dẫn cài cho điện thoại</b>. Mở đường dẫn đó trên điện thoại này, hoặc dán vào ô dưới.</p>
      ${err ? `<div class="msg bad" style="margin-top:10px">${esc(err)}</div>` : ''}
      <form id="fSetup"><label for="sLink">Đường dẫn cài đặt (hoặc mã Gist)</label><input id="sLink" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(PENDING || '')}">
      <label for="sPw">Mật khẩu đồng bộ</label><input id="sPw" type="password" autocomplete="current-password">
      <button class="btn" type="submit">Mở danh mục</button></form>
      <p class="muted" style="margin:12px 0 0">Mật khẩu chỉ lưu trong trình duyệt của điện thoại này để giải mã dữ liệu; không gửi đi đâu.</p></div>`;
  }
  function flash(text, bad, ms) { MSG = { text, bad }; $('#msg').innerHTML = `<div class="msg${bad ? ' bad' : ''}">${esc(text)}</div>`; clearTimeout(flash.t); flash.t = setTimeout(() => { $('#msg').innerHTML = ''; }, ms || 5000); }
  function render() {
    const need = !SNAP && !CFG && !LOCAL;
    $('#p-setup').hidden = !need; $('#tabs').hidden = need;
    ['board', 'pf', 'news', 'me'].forEach(p => { $('#p-' + p).hidden = need || PAGE !== p; });
    $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.p === PAGE));
    head();
    if (need) { renderSetup(); return; }
    if (PAGE === 'board') renderBoard(); else if (PAGE === 'pf') renderPf(); else if (PAGE === 'news') renderNews(); else renderMe();
  }

  /* ------------------------------------------------------------------ thao tác */
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; PAGE = b.dataset.p; render(); window.scrollTo(0, 0); });
  $('#seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; VIEW = b.dataset.v; LS.set('view', VIEW); OPENROW = ''; render(); });
  const stamp = t => { WATCH = JSON.parse(JSON.stringify(watch())); WATCH.mt = WATCH.mt || {}; WATCH.gone = WATCH.gone || {}; WATCH.mt[t] = now(); };
  const parseP = s => { s = String(s).trim().replace(/\./g, '').replace(',', '.'); if (!s) return 0; const v = parseFloat(s); return v > 0 ? (v < 1000 ? v * 1000 : v) : NaN; };
  $('#list').addEventListener('click', e => {
    const b = e.target.closest('button'), row = e.target.closest('.row');
    if (!b || !row) return;
    const t = row.dataset.t;
    if (b.classList.contains('rh')) { OPENROW = OPENROW === t ? '' : t; renderBoard(); return; }
    if (b.dataset.save) { const v = parseP(row.querySelector('[data-tg]').value); if (isNaN(v)) { row.querySelector('[data-tg]').focus(); return; } stamp(t); if (v) WATCH.targets[t] = v; else delete WATCH.targets[t]; const n = row.querySelector('[data-nt]').value.trim(); if (n) WATCH.notes[t] = n; else delete WATCH.notes[t]; OPENROW = ''; changed(); render(); }
    else if (b.dataset.rm) { stamp(t); WATCH.tickers = WATCH.tickers.filter(x => x !== t); delete WATCH.notes[t]; delete WATCH.targets[t]; delete WATCH.mt[t]; WATCH.gone[t] = now(); OPENROW = ''; changed(); render(); }
    else if (b.dataset.addw) { LS.set('peek', (LS.get('peek', []) || []).filter(x => x !== t)); stamp(t); if (!WATCH.tickers.includes(t)) WATCH.tickers.push(t); delete WATCH.gone[t]; changed(); render(); }
  });
  $('#add').addEventListener('submit', e => {
    e.preventDefault();
    const i = e.target.querySelector('input'), t = i.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (t.length < 3) { flash('Mã cổ phiếu có ít nhất 3 ký tự.', true, 2500); return; }
    if (VIEW !== 'watch' || !canWrite()) { const P = LS.get('peek', []) || []; if (!P.includes(t)) P.unshift(t); LS.set('peek', P.slice(0, 30)); i.value = ''; const was = VIEW; VIEW = 'all'; OPENROW = t; LSIG = ''; render(); liveBad = 0; live(); flash(was === 'watch' ? 'Chưa bật quyền sửa nên mã chỉ được xem nhanh ở “Tất cả”. Bật ở tab Emilya để lưu vào Theo dõi.' : 'Đã thêm để xem giá ở “Tất cả” (chỉ trên điện thoại này).', was === 'watch', 4000); return; }
    stamp(t); if (!WATCH.tickers.includes(t)) WATCH.tickers.push(t); delete WATCH.gone[t];
    i.value = ''; VIEW = VIEW === 'held' ? 'watch' : VIEW; changed(); render(); liveBad = 0; live();
  });
  document.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'bSync') { b.disabled = true; LS.del('etag'); await refresh(true); }
    else if (b.dataset.peekrm) { LS.set('peek', peek().filter(x => x !== b.dataset.peekrm)); OPENROW = ''; LSIG = ''; render(); }
    else if (b.id === 'bTok') { const v = ($('#tkIn').value || '').trim(); if (v.length < 20) { flash('Mã truy cập chưa đúng – dán lại nhé.', true); return; } CFG = Object.assign({}, CFG, { t: v }); LS.set('cfg', CFG); flash('Đã bật. Thử thêm mã ở Bảng giá nhé.'); render(); }
    else if (b.id === 'bTheme') { const n = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = n; LS.set('theme', n); render(); }
    else if (b.id === 'bOut') { if (confirm('Xóa mật khẩu, mã truy cập và dữ liệu danh mục khỏi điện thoại này? (Dữ liệu trên máy tính và Gist không bị ảnh hưởng.)')) { ['cfg', 'snap', 'watch', 'etag', 'dirty', 'src'].forEach(LS.del); CFG = SNAP = WATCH = null; Q = {}; render(); } }
    else if (b.id === 'emi') { const r = RULES[Math.floor(Math.random() * RULES.length)]; $('#say').innerHTML = `<b>${r[0]}.</b> ${r[1]}`; setTimeout(head, 9000); }
  });
  let PENDING = '';
  document.addEventListener('submit', async e => {
    if (e.target.id !== 'fSetup') return;
    e.preventDefault();
    const raw = $('#sLink').value.trim(), pw = $('#sPw').value;
    PENDING = raw;
    if (!raw || !pw) { renderSetup('Cần cả đường dẫn cài đặt và mật khẩu đồng bộ.'); return; }
    try {
      const m = /[#&]s=([A-Za-z0-9_\-]+)/.exec(raw);
      let pack;
      if (m) { const b = m[1].replace(/-/g, '+').replace(/_/g, '/'); pack = await decrypt(atob(b + '==='.slice((b.length + 3) % 4)), pw); }
      else pack = { g: raw.replace(/\/+$/, '').split('/').pop() };
      CFG = { g: pack.g, t: pack.t || '', pw }; LS.del('etag');
      await pull();
      LS.set('cfg', CFG); history.replaceState(null, '', location.pathname);
      render(); live();
    } catch (err) { CFG = null; renderSetup(err.message === 'Sai mật khẩu đồng bộ' ? 'Sai mật khẩu đồng bộ – nhập lại nhé.' : 'Chưa mở được: ' + err.message); }
  });
  async function refresh(loud) {
    if (!CFG && !LOCAL) return;
    try { const ch = await pull(); if (loud) flash(ch ? 'Đã tải bản mới nhất từ máy tính.' : 'Máy tính chưa đẩy bản nào mới hơn.', false, 3000); if (DIRTY) push(); }
    catch (e) { if (loud || !SNAP) flash('Chưa tải được dữ liệu mới: ' + e.message, true, 6000); }
    render();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); live(); } else clearTimeout(liveT); });
  setInterval(() => { if (!document.hidden) refresh(); }, 120000);      // 2 phút xem máy tính có bản mới không (có ETag nên lần không đổi gần như không tốn gì)

  /* ------------------------------------------------------------------ khởi động */
  if (/[#&]s=/.test(location.hash) && !CFG) PENDING = location.href;
  render();                       // hiện ngay bản đã lưu lần trước
  refresh().then(() => live());
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { /* bỏ qua */ });
})();
</script>
</body>
</html>
