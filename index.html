<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Danh mục">
<meta name="robots" content="noindex">

<link rel="apple-touch-icon" href="app-192.png">
<!--
  BẢN ĐIỆN THOẠI của app Quản lý danh mục – MỘT file, không thư viện, không biểu đồ nặng (bản 15/11/2026 v7).
  Đặt thư mục này lên GitHub Pages. Trang KHÔNG chứa số liệu: số liệu nằm trong một Gist bí mật, đã mã hóa bằng mật khẩu đồng bộ
  (máy tính đẩy lên – xem pm/sync.py). Trang này: tải Gist → giải mã bằng Web Crypto → hiển thị; trong phiên tự lấy giá trực tiếp từ nguồn công khai.

  v7 (15/11/2026):
  - Tab mới «Hôm nay»: thị trường (chỉ số, trạng thái, tâm lý, độ rộng, ngành, mã tăng / giảm, thế giới, hàng hóa), danh mục hôm nay,
    việc cần để ý (biến động mạnh, về giá chờ mua, luận điểm cần xem lại, chốt quyền…), cơ hội (đầu tư / giao dịch / chờ giá).
  - Bấm vào một mã ở bất kỳ đâu → thẻ mã: giá, vị thế, bối cảnh BCTC, vùng mua, kỹ thuật, tin; nút Theo dõi / Mua / Bán.
  - Theo dõi: thêm / sửa ngay trên điện thoại. KHÔNG MẤT khi thoát app: mọi thay đổi ghi vào bộ nhớ máy NGAY lúc bấm, gửi lên Gist sau 0,4 giây
    (thoát giữa chừng thì gửi lại ở lần mở sau); chỉ xóa "đang chờ" khi máy tính báo đã nhận (ack) → không còn bị bản cũ của máy tính ghi đè.
  - Danh mục: nhập lệnh Mua / Bán / Nạp / Rút / Cổ tức / margin, sửa – xóa lệnh gần đây. Lệnh nằm trong "hộp thư đi" tới khi máy tính ghi sổ;
    trong lúc chờ, số liệu trên điện thoại đã tạm tính theo lệnh mới.
  - Tra mã: gõ mã hoặc tên công ty (gợi ý từ ma.json), chỉ giữ 10 mã tra gần nhất – mã mới lên đầu, mã cũ nhất tự rơi khỏi danh sách.
  Nhẹ máy: chỉ hỏi giá khi màn hình đang bật, chỉ cho các mã đang xem + mã đang giữ; có giá mới chỉ sửa đúng dòng thay đổi.
-->
<style>
:root{--page:#F6F1E7;--sf:#FFFDF8;--sf2:#F3ECDF;--sf3:#E8DFCF;--tx:#2B2520;--tx2:#51483F;--tx3:#6B6156;--bd:rgba(84,62,30,.14);--bd2:rgba(84,62,30,.28);
  --pri:#3B5FD9;--pri-ink:#2F51C4;--pri-soft:rgba(59,95,217,.1);--risk:#B93226;--risk-soft:rgba(201,60,44,.1);--brand:#F6B24B;--brand-soft:#FBE7C2;--brand-line:#E9A234;
  --up:#0E8A4F;--dn:#CF2F2A;--ref:#A66A00;--ceil:#A23BD6;--floor:#0B86A8;--fu:rgba(14,138,79,.18);--fd:rgba(207,47,42,.16);--pink:#FAD3E0;--warn:#A66A00;--warn-soft:rgba(214,150,20,.14);
  --up-soft:rgba(14,138,79,.11);--dn-soft:rgba(207,47,42,.1);
  --font:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme=dark]{--page:#1F1B17;--sf:#2A2520;--sf2:#342E28;--sf3:#40382F;--tx:#F3EDE3;--tx2:#CFC6B8;--tx3:#A99F90;--bd:rgba(255,240,215,.12);--bd2:rgba(255,240,215,.24);
  --pri:#6F8DF0;--pri-ink:#9DB2F6;--pri-soft:rgba(111,141,240,.16);--risk:#FF8378;--risk-soft:rgba(255,131,120,.14);--brand-soft:#4A3A1C;--brand-line:#C98A24;
  --up:#3DD68C;--dn:#FF6B62;--ref:#F5C542;--ceil:#D98BFF;--floor:#4FD2F2;--fu:rgba(61,214,140,.24);--fd:rgba(255,107,98,.24);--pink:#5A3A46;--warn:#F5C542;--warn-soft:rgba(245,197,66,.14);
  --up-soft:rgba(61,214,140,.13);--dn-soft:rgba(255,107,98,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--tx);font:500 15px/1.5 var(--font);padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom));min-height:100vh;overscroll-behavior-y:contain}
body.lock{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri-ink)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.u{color:var(--up)}.d{color:var(--dn)}.r{color:var(--ref)}.ce{color:var(--ceil)}.fl{color:var(--floor)}
.num{font-variant-numeric:tabular-nums}
/* đầu trang: Emilya + lời chào */
.hd{display:flex;gap:12px;align-items:center;padding:14px 0 10px}
.emi{position:relative;flex:none;width:62px;height:62px;border:0;padding:0;background:none}
.emi span{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 35%,#FFF4F8,var(--pink) 80%);box-shadow:inset 0 0 0 2px rgba(236,120,160,.5);transform-origin:50% 90%;animation:fl 3.6s ease-in-out infinite}
.emi img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;transform:scale(1.12);transform-origin:50% 30%;display:block}
.emi i{position:absolute;right:-6px;top:-8px;font:800 20px/1 var(--font);font-style:normal}
.emi.happy span,.emi.joy span{box-shadow:inset 0 0 0 2.5px rgba(240,170,40,.85);animation:bob 1.4s ease-in-out infinite}
.emi.joy span{animation:jump .9s cubic-bezier(.3,.6,.4,1) infinite}
.emi.worry span{box-shadow:inset 0 0 0 2.5px rgba(110,170,215,.8);animation:shake 1.1s linear infinite}
.emi.sad span{filter:saturate(.7);box-shadow:inset 0 0 0 2.5px rgba(120,134,152,.8);animation:droop 4s ease-in-out infinite}
.emi.sleepy span{filter:saturate(.85);box-shadow:inset 0 0 0 2.5px rgba(140,107,224,.6);animation:breath 4.5s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5%) rotate(2deg)}}
@keyframes jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-11%) scale(.97,1.04)}80%{transform:scale(1.03,.97)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2%)}75%{transform:translateX(2%)}}
@keyframes droop{0%,100%{transform:translateY(3%) rotate(-3deg)}50%{transform:translateY(5%) rotate(-4.5deg)}}
@keyframes breath{0%,100%{transform:scale(1) rotate(3deg)}50%{transform:scale(1.03,.98) rotate(4deg)}}
.say{flex:1;min-width:0;background:var(--sf);border:1px solid var(--bd);border-radius:6px 18px 18px 18px;padding:9px 13px;font-size:14px;font-weight:600;color:var(--tx2)}
.say b{color:var(--tx);font-weight:800}.say b.u{color:var(--up)}.say b.d{color:var(--dn)}
/* trạng thái đồng bộ */
.syn{display:flex;gap:8px;align-items:center;margin:0 0 10px;padding:8px 12px;border-radius:12px;background:var(--warn-soft);color:var(--tx2);font-size:13px;font-weight:700}
.syn.bad{background:var(--risk-soft);color:var(--risk)}.syn.ok{background:var(--up-soft);color:var(--up)}
.syn span{flex:1;min-width:0}.syn button{flex:none;border:0;background:var(--sf);border-radius:9px;padding:5px 10px;font-weight:800;font-size:12.5px;color:var(--tx)}
/* thẻ */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
.card h2,.h2{margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;gap:8px}
.h2{margin:16px 4px 8px}
.card h2 .n,.h2 .n{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--sf2);color:var(--tx2);letter-spacing:0}
.card h2 .n.bad{background:var(--risk-soft);color:var(--risk)}
.card h2 a,.card h2 button.lk{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:800;color:var(--pri-ink);background:none;border:0;padding:0;text-decoration:none}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.big small{font-size:15px;font-weight:700;color:var(--tx3);margin-left:4px}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.kp div{background:var(--sf2);border-radius:12px;padding:8px 10px;min-width:0}
.kp small{display:block;font-size:11.5px;font-weight:800;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kp span{display:block;font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--sf2);color:var(--tx2);white-space:nowrap;vertical-align:1px}
.tag.good,.tag.up{background:var(--up-soft);color:var(--up)}.tag.bad,.tag.dn{background:var(--dn-soft);color:var(--dn)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.info{background:var(--pri-soft);color:var(--pri-ink)}
/* thanh trạng thái + chỉ số */
.bar{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;gap:6px;align-items:baseline;min-height:30px;padding:5px 11px;border-radius:999px;background:var(--sf);border:1px solid var(--bd);font-size:13px;font-weight:700;white-space:nowrap}
.pill small{font-weight:650;color:var(--tx3);font-size:12px}
.pill.live{background:var(--fu);border-color:transparent;color:var(--up)}
.pill.live::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--up);align-self:center;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.seg{display:flex;background:var(--sf2);border-radius:13px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;min-height:38px;border-radius:10px;font-weight:700;font-size:14px;color:var(--tx2);padding:0 4px}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:0 1px 3px rgba(84,62,30,.18)}
.seg.sm button{min-height:32px;font-size:13px}
.add{position:relative;display:flex;gap:8px;margin-bottom:10px}
.add input{flex:1;min-width:0;height:44px;border-radius:13px;border:1px solid var(--bd2);background:var(--sf);padding:0 14px;font-weight:700;font-size:16px}
.add input::placeholder{font-weight:600;color:var(--tx3)}
.add button,.btn{height:44px;border-radius:13px;border:0;background:var(--pri);color:#fff;padding:0 16px;font-weight:800;font-size:15px}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--sf);color:var(--tx);border:1px solid var(--bd2)}
.btn.risk{background:var(--sf);color:var(--risk);border:1px solid var(--bd2)}
.btn.up{background:var(--up);color:#fff}.btn.dn{background:var(--dn);color:#fff}
.sug{position:absolute;left:0;right:0;top:48px;z-index:6;background:var(--sf);border:1px solid var(--bd2);border-radius:13px;box-shadow:0 8px 24px rgba(40,30,10,.18);overflow:hidden}
.sug button{display:flex;gap:10px;align-items:baseline;width:100%;border:0;border-bottom:1px solid var(--bd);background:none;padding:10px 14px;text-align:left}
.sug button:last-child{border-bottom:0}
.sug b{font-weight:800;min-width:44px}.sug span{flex:1;min-width:0;color:var(--tx2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sug small{color:var(--tx3);font-weight:700}
.tool{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-2px 2px 8px;font-size:12.5px;color:var(--tx3);font-weight:700}
.tool button{border:0;background:none;color:var(--pri-ink);font-weight:800;font-size:12.5px;padding:4px 0}
/* danh sách mã */
.list{background:var(--sf);border:1px solid var(--bd);border-radius:18px;overflow:hidden}
.row{border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.rh{display:grid;grid-template-columns:minmax(0,1fr) 66px auto;gap:10px;align-items:center;width:100%;min-height:58px;padding:8px 12px 8px 14px;border:0;background:none;text-align:left}
.tk{font-size:16px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tk i{width:7px;height:7px;border-radius:50%;background:var(--brand-line);flex:none}
.tk em{font-style:normal;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--pri-soft);color:var(--pri-ink)}
.tk em.hit{background:var(--pri);color:#fff}
.tk em.pd{background:var(--warn-soft);color:var(--warn)}
.nm{font-size:12px;font-weight:600;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{text-align:right}
.pr b{display:block;font-size:17px;font-weight:800;border-radius:6px;padding:0 3px}
.pr span{display:inline-block;font-size:12.5px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--sf2)}
.fu{animation:fu .7s ease-out}.fd{animation:fd .7s ease-out}
@keyframes fu{0%{background:var(--fu)}100%{background:transparent}}
@keyframes fd{0%{background:var(--fd)}100%{background:transparent}}
.dt{padding:2px 14px 14px;display:none}
.row.open .dt{display:block}
.row.open .rh{background:var(--sf2)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.g3 div{background:var(--sf2);border-radius:10px;padding:6px 9px;min-width:0}
.g3 small{display:block;font-size:11px;font-weight:800;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g3 b{font-size:14.5px;font-weight:800;white-space:nowrap}
.fm label,.dt label{display:block;font-size:12px;font-weight:800;color:var(--tx3);margin:12px 0 4px}
.fm input,.fm textarea,.fm select,.dt input,.dt textarea,.set input{width:100%;border:1px solid var(--bd2);border-radius:11px;background:var(--sf);padding:10px 12px;font-size:16px;font-weight:600}
.dt textarea,.fm textarea{min-height:60px;resize:vertical}
.ac{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ac .btn{flex:1 1 0;height:42px;font-size:13.5px;padding:0 5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac .btn.x1{flex:none;width:44px}
.wbar{height:5px;border-radius:3px;background:var(--sf3);margin-top:4px;overflow:hidden}
.wbar i{display:block;height:100%;background:var(--brand-line);border-radius:3px}
.note{padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px;color:var(--tx2)}
.note:last-child{border-bottom:0;padding-bottom:0}
.note b{display:block;color:var(--tx)}
.note.bad b::before{content:'! ';color:var(--risk)}
.rule{padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px;color:var(--tx2)}
.rule:last-child{border-bottom:0}
.rule b{color:var(--tx)}
.rule span{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--tx);font-size:12px;font-weight:800;margin-right:6px}
.muted{color:var(--tx3);font-size:12.5px}
.empty{padding:28px 16px;text-align:center;color:var(--tx2)}
.msg{margin:0 0 10px;padding:10px 13px;border-radius:13px;background:var(--pri-soft);color:var(--pri-ink);font-size:13.5px;font-weight:650}
.msg.bad{background:var(--risk-soft);color:var(--risk)}
.set label{display:block;font-size:13px;font-weight:800;color:var(--tx2);margin:12px 0 4px}
.set .btn{width:100%;margin-top:14px}
/* Hôm nay */
.vni{display:flex;gap:12px;align-items:center;justify-content:space-between}
.vni .v{font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
.vni .v small{font-size:14px;font-weight:800;margin-left:6px}
.sub{font-size:12.5px;color:var(--tx3);font-weight:650;margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;gap:6px;align-items:baseline;padding:4px 10px;border-radius:999px;background:var(--sf2);font-size:12.5px;font-weight:800;white-space:nowrap}
.chip small{font-weight:700;color:var(--tx3);font-size:11.5px}
.reg{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:13px;background:var(--sf2)}
.reg b{display:block;font-size:14.5px}.reg p{margin:2px 0 0;font-size:13px;color:var(--tx2)}
.reg .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--ref)}
.reg .dot.good{background:var(--up)}.reg .dot.bad{background:var(--dn)}
.brd{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:8px 0 4px;background:var(--sf3)}
.brd i{display:block;height:100%}
.brd .bu{background:var(--up)}.brd .bf{background:var(--ref);opacity:.55}.brd .bd{background:var(--dn)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.two h3,.h3{margin:0 0 4px;font-size:12px;font-weight:800;color:var(--tx3)}
.h3{margin:10px 0 6px}
.kv{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx2);font-weight:650}
.kv b{flex:none}
button.kv{width:100%;border:0;border-bottom:1px solid var(--bd);background:none;text-align:left}
button.kv span{color:var(--tx);font-weight:800}
.it{display:flex;gap:10px;align-items:flex-start;width:100%;padding:9px 0;border:0;border-bottom:1px solid var(--bd);background:none;text-align:left}
.it:last-child{border-bottom:0}
.it .ic{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:800;background:var(--sf2);color:var(--tx2)}
.it .ic.bad{background:var(--risk-soft);color:var(--risk)}.it .ic.good{background:var(--up-soft);color:var(--up)}.it .ic.info{background:var(--pri-soft);color:var(--pri-ink)}.it .ic.warn{background:var(--warn-soft);color:var(--warn)}
.it div{min-width:0;flex:1}.it b{display:block;font-size:14.5px;line-height:1.35}.it small{display:block;font-size:12.5px;color:var(--tx3);line-height:1.4;margin-top:1px}
.op{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--bd);background:none;text-align:left}
.op:last-child{border-bottom:0}
.op .a{font-size:12.5px;color:var(--tx2);grid-column:1/-1;line-height:1.4}
.op .r2{text-align:right;font-size:13px;font-weight:800}
.op .r2 small{display:block;font-weight:700;color:var(--tx3);font-size:11.5px}
.qbar{display:inline-block;width:40px;height:5px;border-radius:3px;background:var(--sf3);vertical-align:2px;margin-left:4px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--pri)}
.wg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.wg div{background:var(--sf2);border-radius:10px;padding:6px 8px;min-width:0}
.wg small{display:block;font-size:11px;font-weight:800;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wg b{display:block;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wg span{font-size:12px;font-weight:800}
details.mo{margin-top:8px}details.mo summary{cursor:pointer;font-size:12.5px;font-weight:800;color:var(--pri-ink);list-style:none;padding:4px 0}

<script>
(() => {
  'use strict';
  /* ------------------------------------------------------------------ tiện ích */
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const isN = v => typeof v === 'number' && isFinite(v);
  const NF = d => new Intl.NumberFormat('vi-VN', { minimumFractionDigits: d, maximumFractionDigits: d });
  const n0 = NF(0), n1 = NF(1), n2 = NF(2), nU = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 3 });
  const px = v => (isN(v) ? n2.format(v / 1000) : '–');
  const vol = v => (!isN(v) ? '–' : v >= 1e8 ? n0.format(v / 1e6) + 'M' : v >= 1e6 ? n2.format(v / 1e6) + 'M' : v >= 1e4 ? n1.format(v / 1e3) + 'K' : n0.format(v));
  const fm = (v, d = 1) => (isN(v) ? (v >= 0.00005 ? '+' : v <= -0.00005 ? '−' : '') + NF(d).format(Math.abs(v * 100)) + '%' : '–');
  const money = v => { if (!isN(v)) return '–'; const a = Math.abs(v), s = v > 0 ? '+' : v < 0 ? '−' : ''; return s + (a >= 1e9 ? NF(2).format(a / 1e9) + ' tỷ' : a >= 1e6 ? n1.format(a / 1e6) + ' tr' : n0.format(a / 1e3) + ' nghìn'); };
  const vnd = v => (isN(v) ? n0.format(Math.round(v)) + ' đ' : '–');
  const ud = v => (v > 0 ? 'u' : v < 0 ? 'd' : '');
  const tn = t => (t === 'good' ? 'good' : t === 'bad' ? 'bad' : t === 'warn' ? 'warn' : t === 'info' ? 'info' : '');
  const hm = ts => (ts ? new Date(ts * 1000).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) : '');
  const dmhm = ts => { if (!ts) return 'chưa có'; const d = new Date(ts * 1000), t = new Date(); return (d.toDateString() === t.toDateString() ? '' : d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' }) + ' ') + hm(ts); };
  const dm = s => (s ? String(s).slice(8, 10) + '/' + String(s).slice(5, 7) : '');
  const pad = n => String(n).padStart(2, '0');
  const vnNow = () => new Date(Date.now() + (new Date().getTimezoneOffset() + 420) * 60000);
  const todayVN = () => { const d = vnNow(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const now = () => Math.floor(Date.now() / 1000);
  const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
  const rid = p => p + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 7);
  const LS = { get(k, d) { try { const v = localStorage.getItem('qm-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('qm-' + k, JSON.stringify(v)); } catch (e) { /* bỏ qua */ } }, del(k) { try { localStorage.removeItem('qm-' + k); } catch (e) { /* bỏ qua */ } } };
  const APPV = 'bản 20/11 v13';
  const RECENT_MAX = 10;              // Tra mã: chỉ giữ 10 mã tra gần nhất
  const LOCAL = location.hostname === '127.0.0.1' || location.hostname === 'localhost';   // xem thử trên máy tính: đọc thẳng app, không cần Gist
  const th = LS.get('theme', '') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = th;
  const TY = { BUY: 'Mua', SELL: 'Bán', DEPOSIT: 'Nạp tiền', WITHDRAW: 'Rút tiền', DIV_CASH: 'Cổ tức tiền', DIV_STOCK: 'Cổ tức CP / thưởng', MARGIN_PAY: 'Trả nợ margin',
    MARGIN_INT: 'Trả lãi margin', MARGIN_BORROW: 'Vay margin', MARGIN_SET: 'Chốt số dư margin', COST_SET: 'Đặt lại giá vốn' };
  const TY_PHONE = ['BUY', 'SELL', 'DEPOSIT', 'WITHDRAW', 'DIV_CASH', 'DIV_STOCK', 'MARGIN_PAY', 'MARGIN_INT', 'MARGIN_BORROW'];
  const IS_MONEY = ty => ['DEPOSIT', 'WITHDRAW', 'DIV_CASH', 'MARGIN_PAY', 'MARGIN_INT', 'MARGIN_BORROW'].includes(ty);
  const NEED_T = ty => ['BUY', 'SELL', 'DIV_CASH', 'DIV_STOCK'].includes(ty);

  /* ------------------------------------------------------------------ mã hóa – cùng công thức với pm/sync.py */
  const te = new TextEncoder(), td = new TextDecoder();
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64e = u => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  const cat = (...a) => { const o = new Uint8Array(a.reduce((n, x) => n + x.length, 0)); let p = 0; for (const x of a) { o.set(x, p); p += x.length; } return o; };
  async function keys(pw, salt) {
    const km = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveBits']);
    const k = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 150000 }, km, 512));
    const imp = x => crypto.subtle.importKey('raw', x, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    return [await imp(k.slice(0, 32)), await imp(k.slice(32))];
  }
  async function xor(kenc, nonce, data) {
    const nb = Math.ceil(data.length / 32), jobs = [];
    for (let i = 0; i < nb; i++) { const c = new Uint8Array(20); c.set(nonce); new DataView(c.buffer).setUint32(16, i); jobs.push(crypto.subtle.sign('HMAC', kenc, c)); }
    const ks = await Promise.all(jobs), out = new Uint8Array(data.length);
    for (let i = 0; i < nb; i++) { const k = new Uint8Array(ks[i]), o = i * 32; for (let j = 0; j < 32 && o + j < data.length; j++) out[o + j] = data[o + j] ^ k[j]; }
    return out;
  }
  const MAGIC = te.encode('QLDM1');
  async function decrypt(text, pw) {
    const o = JSON.parse(text), salt = b64d(o.salt), nonce = b64d(o.nonce), tag = b64d(o.tag), ct = b64d(o.ct);
    const [kenc, kmac] = await keys(pw, salt);
    const t2 = new Uint8Array(await crypto.subtle.sign('HMAC', kmac, cat(MAGIC, salt, nonce, ct)));
    let diff = tag.length ^ t2.length; for (let i = 0; i < t2.length; i++) diff |= tag[i] ^ t2[i];
    if (diff) throw new Error('Sai mật khẩu đồng bộ');
    return JSON.parse(td.decode(await xor(kenc, nonce, ct)));
  }
  async function encrypt(obj, pw) {
    const pt = te.encode(JSON.stringify(obj)), salt = crypto.getRandomValues(new Uint8Array(16)), nonce = crypto.getRandomValues(new Uint8Array(16));
    const [kenc, kmac] = await keys(pw, salt), ct = await xor(kenc, nonce, pt);
    const tag = new Uint8Array(await crypto.subtle.sign('HMAC', kmac, cat(MAGIC, salt, nonce, ct)));
    return JSON.stringify({ v: 1, alg: 'PBKDF2-SHA256-150000/HMAC-CTR/HMAC-SHA256', salt: b64e(salt), nonce: b64e(nonce), tag: b64e(tag), ct: b64e(ct) });
  }
  /* gộp danh sách theo dõi – cùng quy tắc với pm/sync.py merge_watch: từng mã, lần sửa sau cùng thắng */

      if (!addWatch(t)) return;
      OPENROW = ''; rerender(); liveBad = 0; liveSoon();
      flash(`Đã thêm ${t} vào Theo dõi – đã lưu trong điện thoại, đang gửi lên máy tính.`, false, 3000);
    } else {
      addRecent(t); VIEW = 'find'; LS.set('view', VIEW); OPENROW = t; rerender(); liveBad = 0; liveSoon();
      if (MA && Object.keys(MA).length && !MA[t]) flash(`Không thấy ${t} trong danh sách mã – kiểm tra lại nếu không có giá.`, true, 3500);
    }
  });
  /* mọi nút còn lại */
  document.addEventListener('click', async e => {
    const b = e.target.closest('button, [data-open]'); if (!b) return;
    const d = b.dataset;
    if (d.open && !d.go) { openSheet({ k: 't', t: d.open }); return; }
    if (d.close !== undefined) { closeSheet(); return; }
    if (d.go) { PAGE = d.go; LS.set('page', PAGE); render(true); window.scrollTo(0, 0); liveSoon(); return; }
    if (d.addw) { if (addWatch(d.addw)) { rerender(); flash(`Đã thêm ${d.addw} vào Theo dõi.`, false, 2500); } return; }
    if (d.buy) { txOpen('BUY', d.buy); return; }
    if (d.sell) { txOpen('SELL', d.sell); return; }
    if (d.new) { txOpen(d.new, ''); return; }
    if (d.tx) { const x = (S().txs || []).find(y => y.id === d.tx); if (x) txOpen(x.ty, x.t, x); return; }
    if (d.save) {
      const box = b.closest('.dt, .pane'), t = d.save, tg = box.querySelector('[data-tg]'), v = parseP(tg.value);
      if (isNaN(v)) { tg.focus(); flash('Giá chờ mua chưa đúng – ví dụ 42,5', true, 2500); return; }
      stamp(t); if (v) WATCH.targets[t] = v; else delete WATCH.targets[t];
      const n = box.querySelector('[data-nt]').value.trim(); if (n) WATCH.notes[t] = n; else delete WATCH.notes[t];
      if (box.classList.contains('dt')) OPENROW = '';
      document.activeElement && document.activeElement.blur && document.activeElement.blur();
      changed('watch'); rerender(); return;
    }
    if (d.rm) { const t = d.rm; stamp(t); WATCH.tickers = WATCH.tickers.filter(x => x !== t); delete WATCH.notes[t]; delete WATCH.targets[t]; delete WATCH.mt[t]; WATCH.gone[t] = now(); OPENROW = ''; changed('watch'); rerender(); flash(`Đã bỏ ${t} khỏi Theo dõi.`, false, 2500); return; }
    if (d.recrm) { RECENT = RECENT.filter(x => x !== d.recrm); LS.set('recent', RECENT); OPENROW = ''; rerender(); return; }
    if (d.opv) { OPV = d.opv; LS.set('opv', OPV); renderHome(); liveSoon(); return; }
    if (d.nv) { NV = d.nv; LS.set('nview', NV); renderNews(); return; }
    if (d.cancel) { cancelOp(d.cancel); return; }
    if (d.ty) { SHEET.ty = d.ty; renderSheet(); return; }
    if (d.pick) { SHEET.f.t = d.pick; const q = quote(d.pick), h = pfView().by[d.pick]; if (SHEET.ty === 'SELL' && h && !SHEET.f.qty) SHEET.f.qty = n0.format(h.qty); if ((SHEET.ty === 'SELL' || SHEET.ty === 'BUY') && isN(q.price) && !SHEET.f.price) SHEET.f.price = n2.format(q.price / 1000); renderSheet(); return; }
    if (d.sg && b.closest('#tsug')) { SHEET.f.t = d.sg; const q = quote(d.sg); if ((SHEET.ty === 'BUY' || SHEET.ty === 'SELL') && isN(q.price) && !SHEET.f.price) SHEET.f.price = n2.format(q.price / 1000); renderSheet(); liveSoon(); return; }
    if (d.txdel !== undefined) { txDelete(); return; }
    switch (b.id) {
      case 'bSync': case 'bSync2': case 'bSync3': b.disabled = true; LS.del('etag'); await refresh(true); liveBad = 0; live(); return;
      case 'bPush': await push(); return;
      case 'bSort': SORT = ({ def: 'up', up: 'dn', dn: 'az', az: 'def' })[SORT]; LS.set('sort', SORT); LSIG = ''; renderBoard(); return;
      case 'bRecClr': if (confirm('Xóa lịch sử tra mã trên điện thoại này?')) { RECENT = []; LS.set('recent', RECENT); OPENROW = ''; rerender(); } return;
      case 'bTodo': TODO_ALL = !TODO_ALL; renderHome(); return;
      case 'bWorld': WORLD_ALL = !WORLD_ALL; renderHome(); return;
      case 'bTxAll': TX_ALL = !TX_ALL; renderPf(); return;
      case 'bTok': { const v = ($('#tkIn').value || '').trim(); if (v.length < 20) { flash('Mã truy cập chưa đúng – dán lại nhé.', true); return; } CFG = Object.assign({}, CFG, { t: v }); LS.set('cfg', CFG); flash('Đã bật. Giờ có thể thêm mã theo dõi và nhập lệnh trên điện thoại.'); rerender(); if (DIRTY) push(); return; }
      case 'bTheme': { const n = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = n; LS.set('theme', n); render(true); return; }
      case 'bOut': {
        const pend = OUTBOX.length + (WPEND ? 1 : 0);
        if (confirm((pend ? `CẢNH BÁO: còn ${pend} thay đổi máy tính chưa nhận – xóa bây giờ sẽ mất.\n\n` : '') + 'Xóa mật khẩu, mã truy cập và dữ liệu danh mục khỏi điện thoại này? (Dữ liệu trên máy tính và Gist không bị ảnh hưởng.)')) {
          ['cfg', 'snap', 'watch', 'etag', 'dirty', 'src', 'wpend', 'outbox', 'recent', 'wpt'].forEach(LS.del); CFG = SNAP = WATCH = null; OUTBOX = []; WPEND = 0; WPT = {}; DIRTY = false; RECENT = []; Q = {}; QT = {}; render(true);
        }
        return;
      }
      case 'emi': { const r = RULES[Math.floor(Math.random() * RULES.length)]; $('#say').innerHTML = `<b>${r[0]}.</b> ${r[1]}`; setTimeout(head, 9000); return; }
    }
  });
  /* bảng trượt: bấm nền tối để đóng; nút Back của điện thoại cũng đóng */
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
  window.addEventListener('popstate', () => { if (SHEET) hideSheet(); });
  $('#pane').addEventListener('focusout', e => { if (e.target.dataset && e.target.dataset.f === 't') setTimeout(() => { const b = $('#tsug'); if (b) b.hidden = true; }, 200); });
  $('#pane').addEventListener('change', e => { const s = e.target.closest('[data-tysel]'); if (s && s.value) { SHEET.ty = s.value; renderSheet(); } });
  $('#pane').addEventListener('input', e => {
    const el = e.target, k = el.dataset.f;
    if (!SHEET || SHEET.k !== 'tx' || !k) return;
    SHEET.f[k] = el.value;
    if (k === 'fee') SHEET.feeAuto = el.value.trim() === '';
    if (k === 't') { loadMA().then(() => showSug($('#tsug'), el.value)); }
    const P = txPreview();
    $('#txp').innerHTML = P.html;
    const sb = $('#txf [type=submit]'); if (sb) sb.disabled = !P.ok;
    const fe = $('#txf [data-f=fee]'); if (fe && SHEET.feeAuto && k !== 'fee') fe.value = P.c.fee ? n0.format(P.c.fee) : '';
  });
  $('#pane').addEventListener('submit', e => {
    if (e.target.id !== 'txf') return;
    e.preventDefault();
    const P = txPreview(); if (!P.ok) return;
    const c = P.c, X = SHEET, f = X.f;
    const txn = { id: X.id || rid('ph'), type: c.ty, date: f.date, ticker: NEED_T(c.ty) ? c.t : '', qty: ['BUY', 'SELL', 'DIV_STOCK'].includes(c.ty) ? c.qty : 0, price: c.ty === 'BUY' || c.ty === 'SELL' ? c.price : 0,
      amount: IS_MONEY(c.ty) ? c.amount : 0, fee: c.ty === 'BUY' || c.ty === 'SELL' ? c.fee : 0, note: String(f.note || '').trim().slice(0, 120) };
    const orig = X.orig ? { id: X.orig.id, type: X.orig.ty, date: X.orig.d, ticker: X.orig.t, qty: X.orig.q, price: X.orig.p, amount: X.orig.a, fee: X.orig.f, note: X.orig.n } : null;
    OUTBOX = OUTBOX.filter(o => !(o.txn && o.txn.id === txn.id && o.op === 'add' && !o.sl));    // sửa lại một lệnh đang chờ → thay luôn
    OUTBOX.push({ oid: rid('o'), op: 'add', txn, ts: now(), edit: !!X.id, orig });
    changed('ops'); hideSheet(); try { if (history.state && history.state.qs) history.back(); } catch (er) { /* bỏ qua */ }
    if (txn.ticker && (txn.type === 'BUY' || txn.type === 'SELL')) addRecent(txn.ticker);
    rerender();
    flash(`Đã ghi «${opText({ op: 'add', txn, edit: !!X.id })}» vào hộp thư đi – đang gửi lên máy tính.`, false, 4000);
  });
  function txDelete() {
    const X = SHEET; if (!X || !X.id) return;
    if (!confirm('Xóa lệnh này khỏi sổ? Máy tính sẽ xóa ở lần đồng bộ kế tiếp.')) return;
    const o = X.orig;
    OUTBOX = OUTBOX.filter(y => !(y.txn && y.txn.id === X.id && !y.sl));
    OUTBOX.push({ oid: rid('o'), op: 'del', id: X.id, desc: `${TY[o.ty] || o.ty}${o.t ? ' ' + o.t : ''} ngày ${dm(o.d)}`, ts: now(),
      orig: { id: o.id, type: o.ty, date: o.d, ticker: o.t, qty: o.q, price: o.p, amount: o.a, fee: o.f, note: o.n } });
    changed('ops'); hideSheet(); try { if (history.state && history.state.qs) history.back(); } catch (er) { /* bỏ qua */ }
    rerender();
  }
  /* hủy một lệnh đang chờ: bỏ khỏi hộp thư + (phòng khi máy tính đã kịp ghi) gửi kèm lệnh hoàn tác */
  function cancelOp(oid) {
    const o = OUTBOX.find(x => x.oid === oid); if (!o) return;
    if (!confirm(`Hủy «${opText(o)}»?`)) return;
    OUTBOX = OUTBOX.filter(x => x.oid !== oid);
    if (o.op === 'add' && !o.edit) OUTBOX.push({ oid: rid('o'), op: 'del', id: o.txn.id, desc: opText(o), ts: now(), sl: 1 });
    else if (o.orig) OUTBOX.push({ oid: rid('o'), op: 'add', txn: o.orig, ts: now(), sl: 1, edit: true });
    changed('ops'); rerender(); flash('Đã hủy lệnh.', false, 2500);
  }
  let PENDING = '';
  document.addEventListener('submit', async e => {
    if (e.target.id !== 'fSetup') return;
    e.preventDefault();
    const raw = $('#sLink').value.trim(), pw = $('#sPw').value;
    PENDING = raw;
    if (!raw || !pw) { renderSetup('Cần cả đường dẫn cài đặt và mật khẩu đồng bộ.'); return; }
    try {
      const m = /[#&]s=([A-Za-z0-9_\-]+)/.exec(raw);
      let pack;
      if (m) { const b = m[1].replace(/-/g, '+').replace(/_/g, '/'); pack = await decrypt(atob(b + '==='.slice((b.length + 3) % 4)), pw); }
      else pack = { g: raw.replace(/\/+$/, '').split('/').pop() };
      CFG = { g: pack.g, t: pack.t || '', pw }; LS.del('etag');
      await pull();
      LS.set('cfg', CFG); history.replaceState(null, '', location.pathname);
      PAGE = 'home'; render(true); live();
    } catch (err) { CFG = null; renderSetup(err.message === 'Sai mật khẩu đồng bộ' ? 'Sai mật khẩu đồng bộ – nhập lại nhé.' : 'Chưa mở được: ' + err.message); }
  });
  async function refresh(loud) {
    if (!CFG && !LOCAL) return;
    try { const ch = await pull(); if (loud) flash(ch ? 'Đã tải bản mới nhất từ máy tính.' : 'Máy tính chưa đẩy bản nào mới hơn.', false, 3000); if (DIRTY) push(); }
    catch (e) { if (loud || !SNAP) flash('Chưa tải được dữ liệu mới: ' + e.message, true, 6000); }
    render(); if (SHEET && SHEET.k === 't' && !$('#pane :focus')) renderSheet();
  }
  /* rời app (chuyển app, khóa máy, vuốt tắt): còn thay đổi chưa gửi → gửi ngay (keepalive); không kịp thì lần mở sau gửi tiếp – dữ liệu đã nằm trong máy */
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); live(); } else { clearTimeout(liveT); if (DIRTY) push(true); } });
  window.addEventListener('pagehide', () => { if (DIRTY) push(true); });
  window.addEventListener('online', () => { if (DIRTY) push(); refresh(); });
  setInterval(() => { if (!document.hidden) refresh(); }, 120000);      // 2 phút xem máy tính có bản mới không (có ETag nên lần không đổi gần như không tốn gì)

  /* ------------------------------------------------------------------ khởi động */
  window.__qm = { encrypt, decrypt, mergeWatch, take, pfView, totals, suggest: v => suggest(v), state: () => ({ WATCH, WPEND, OUTBOX, DIRTY, RECENT, PAGE, VIEW }) };   // để kiểm thử
  if (/[#&]s=/.test(location.hash) && !CFG) PENDING = location.href;
  render(true);                   // hiện ngay bản đã lưu lần trước (kể cả thay đổi chưa gửi)
  refresh().then(() => { live(); if (DIRTY) push(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { /* bỏ qua */ });
})();
</script>
